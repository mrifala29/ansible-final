- name: Create ClickHouse directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ clickhouse_base_dir }}"
    - "{{ clickhouse_data_dir }}"
    - "{{ clickhouse_config_dir }}"
    - "{{ clickhouse_config_dir }}/users.d"

- name: Copy users config
  template:
    src: users.xml.j2
    dest: "{{ clickhouse_config_dir }}/users.d/custom.xml"
    mode: '0644'
  notify: restart clickhouse

- name: Copy docker-compose file
  template:
    src: docker-compose.yml.j2
    dest: "{{ clickhouse_base_dir }}/docker-compose.yml"
    mode: '0644'
  notify: restart clickhouse

- name: Run ClickHouse container
  command: "docker compose -f {{ clickhouse_base_dir }}/docker-compose.yml up -d"