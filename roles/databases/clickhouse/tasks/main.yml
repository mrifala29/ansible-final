- name: Create ClickHouse directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ clickhouse_data_dir }}"
    - "{{ clickhouse_config_dir }}"
    - "{{ clickhouse_config_dir }}/users.d"

- name: Copy docker-compose file
  template:
    src: docker-compose.yml
    dest: /opt/clickhouse/docker-compose.yml

- name: Run ClickHouse container
  command: docker compose up -d
  args:
    chdir: /opt/clickhouse

- name: Copy users config
  template:
    src: users.xml.j2
    dest: "{{ clickhouse_config_dir }}/users.d/custom.xml"
  notify: restart clickhouse