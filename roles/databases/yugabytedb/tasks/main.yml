- name: Set vm.max_map_count
  sysctl:
    name: vm.max_map_count
    value: '262144'
    state: present
    reload: yes

- name: Install Docker
  apt:
    name: docker.io
    state: present
    update_cache: true

- name: Ensure Docker service started
  service:
    name: docker
    state: started
    enabled: yes

- name: Install docker-compose v2 (binary)
  get_url:
    url: "https://github.com/docker/compose/releases/download/{{ docker_compose_version }}/docker-compose-linux-x86_64"
    dest: /usr/local/bin/docker-compose
    mode: '0755'

- name: Create docker-compose symlink
  file:
    src: /usr/local/bin/docker-compose
    dest: /usr/bin/docker-compose
    state: link
    force: yes

- name: Create directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: '1000'
    group: '1000'
  loop:
    - "{{ yugabytedb_base_dir }}"
    - "{{ yugabytedb_data_dir }}"
    - "{{ yugabytedb_log_dir }}"
    - "{{ yugabytedb_conf_dir }}"

- name: Generate yugabytedb config
  template:
    src: yugabytedb.conf.j2
    dest: "{{ yugabytedb_conf_dir }}/yugabytedb.conf"
  notify: restart yugabytedb

- name: Generate docker-compose.yml
  template:
    src: docker-compose.j2
    dest: "{{ docker_compose_path }}"
  notify: restart yugabytedb

- name: Start YugabyteDB
  command: docker-compose -f {{ docker_compose_path }} up -d
  register: compose_up
  changed_when: "'Started' in compose_up.stdout or 'Creating' in compose_up.stdout"

- name: Wait for YSQL port
  wait_for:
    host: 127.0.0.1
    port: "{{ yugabytedb_ysql_port }}"
    delay: 10
    timeout: 120

- name: Create linkit-dev user
  command: >
    docker exec yugabytedb
    ysqlsh -h 127.0.0.1 -p 5433 -U yugabyte -d yugabyte -c
    "DO $$ BEGIN
       IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ yugabytedb_username }}') THEN
         CREATE ROLE {{ yugabytedb_username }} WITH LOGIN PASSWORD '{{ yugabytedb_password }}' SUPERUSER;
       END IF;
     END $$;"
  register: create_user
  changed_when: false
  ignore_errors: yes