---
- name: Ensure Keycloak directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ keycloak_compose_dir }}"
    - "{{ keycloak_data_dir }}"

- name: Render .env for Keycloak
  copy:
    dest: "{{ keycloak_compose_dir }}/.env"
    content: |
      KEYCLOAK_ADMIN={{ keycloak_admin }}
      KEYCLOAK_ADMIN_PASSWORD={{ keycloak_admin_password }}
    owner: root
    group: root
    mode: "0600"

- name: Render docker compose file for Keycloak
  template:
    src: docker-compose.j2
    dest: "{{ keycloak_compose_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Start Keycloak via docker compose v2
  community.docker.docker_compose_v2:
    project_src: "{{ keycloak_compose_dir }}"
    state: present
