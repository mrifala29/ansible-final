- name: Add Grafana repository
  deb822_repository:
    name: grafana
    types: [deb]
    uris: https://packages.grafana.com/oss/deb
    suites: stable
    components: [main]
    signed_by: https://packages.grafana.com/gpg.key
    state: present


- name: Install Grafana
  apt:
    name: grafana
    state: present
    update_cache: yes

- name: Enable and start Grafana service
  service:
    name: grafana-server
    state: started
    enabled: yes
