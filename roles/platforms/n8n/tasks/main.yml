- name: Create n8n base directory
  file:
    path: "{{ n8n_base_dir }}"
    state: directory
    mode: "0755"

- name: Create n8n data directory
  file:
    path: "{{ n8n_data_dir }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"

- name: Generate docker-compose for n8n
  template:
    src: docker-compose.j2
    dest: "{{ n8n_base_dir }}/docker-compose.yml"
    mode: "0644"
  notify: Restart n8n

- name: Start n8n container
  command: docker compose up -d
  args:
    chdir: "{{ n8n_base_dir }}"