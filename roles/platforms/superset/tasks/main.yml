- name: Create superset directory
  file:
    path: "{{ superset_dir }}"
    state: directory
    mode: "0755"

- name: Create Superset home directory
  file:
    path: "{{ superset_dir }}/superset_home"
    state: directory
    owner: 1000
    group: 1000
    mode: "0755"

- name: Copy docker compose
  template:
    src: docker-compose.j2
    dest: "{{ superset_dir }}/docker-compose.yml"
  notify: restart superset

- name: Copy Dockerfile
  template:
    src: Dockerfile.j2
    dest: "{{ superset_dir }}/Dockerfile"

- name: Start Superset
  community.docker.docker_compose_v2:
    project_src: "{{ superset_dir }}"
    build: always
    state: present