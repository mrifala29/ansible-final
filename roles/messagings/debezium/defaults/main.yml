debezium_base_dir: /opt/debezium

debezium_compose_file: docker-compose.yml
debezium_psql_compose_file: docker-compose-psql.yml

debezium_network_name: cdc-debezium-network

# Ports
kafka_port: 9092
debezium_connect_port: 9096
kafka_ui_port: 9095

# Enable optional services
enable_postgres: false

# Timezone
timezone: Asia/Jakarta