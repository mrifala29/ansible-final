- name: Install nginx
  apt:
    name: nginx
    state: present
    update_cache: yes

- name: Configure nginx main config
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/default
    owner: root
    group: root
    mode: '0644'
  notify: Restart nginx

- name: Enable and start nginx
  service:
    name: nginx
    state: started
    enabled: yes