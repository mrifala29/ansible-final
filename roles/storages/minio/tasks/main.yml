---
- name: Ensure MinIO directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ minio_data_dir }}"
    - "{{ minio_compose_dir }}"

- name: Copy .env to MinIO compose directory
  copy:
    src: "{{ playbook_dir }}/../.env"
    dest: "{{ minio_compose_dir }}/.env"
    owner: root
    group: root
    mode: "0600"

- name: Render docker compose file for MinIO
  template:
    src: docker-compose.j2
    dest: "{{ minio_compose_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Start MinIO via docker compose v2
  community.docker.docker_compose_v2:
    project_src: "{{ minio_compose_dir }}"
    state: present
